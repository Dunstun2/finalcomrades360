---
deployment:
  tasks:
    - /bin/mkdir -p /home/vdranjxy/public_html
    - /bin/mkdir -p /home/vdranjxy/comrades-master
    
    # 1. Sync Frontend to public_html
    - /usr/bin/rsync -avz frontend/dist/ /home/vdranjxy/public_html/
    - /bin/cp .htaccess /home/vdranjxy/public_html/.htaccess
    
    # 2. Sync Backend to comrades-master (the runtime root)
    # We copy the CONTENTS of the backend folder into comrades-master
    - /usr/bin/rsync -avz --exclude 'node_modules' --exclude 'uploads' --exclude 'error.log' backend/ /home/vdranjxy/comrades-master/
    
    # 3. Install backend dependencies (which now includes PM2)
    - export PATH=/opt/cpanel/ea-nodejs20/bin:/opt/cpanel/ea-nodejs18/bin:$PATH && cd /home/vdranjxy/comrades-master && npm install
    
    # 3. Restart the backend using PM2
    - export PATH=/opt/cpanel/ea-nodejs20/bin:/opt/cpanel/ea-nodejs18/bin:$PATH && cd /home/vdranjxy/comrades-master && ./node_modules/.bin/pm2 restart comrades360
