---
deployment:
  # Create log directory first to fix cPanel null log_path error
  tasks:
    - export DEPLOYLOG=/home/vdranjxy/logs/git-deploy.log
    - /bin/mkdir -p /home/vdranjxy/logs
    - /bin/mkdir -p /home/vdranjxy/public_html
    - /bin/mkdir -p /home/vdranjxy/comrades-master
    
    # Log start
    - echo "=== Deployment started at $(date) ===" >> /home/vdranjxy/logs/git-deploy.log
    
    # 1. Sync Frontend to public_html
    - /bin/cp -rf frontend/dist/* /home/vdranjxy/public_html/ >> /home/vdranjxy/logs/git-deploy.log 2>&1
    - /bin/cp -f .htaccess /home/vdranjxy/public_html/.htaccess >> /home/vdranjxy/logs/git-deploy.log 2>&1
    
    # 2. Sync Backend to comrades-master (the runtime root)
    - /bin/cp -rf backend/* /home/vdranjxy/comrades-master/ >> /home/vdranjxy/logs/git-deploy.log 2>&1
    - /bin/cp -f backend/.sequelizerc /home/vdranjxy/comrades-master/.sequelizerc >> /home/vdranjxy/logs/git-deploy.log 2>&1 || true
    
    # 3. Auto-restart PM2 and save process list
    - cd /home/vdranjxy/comrades-master && ./node_modules/.bin/pm2 restart comrades360 --update-env >> /home/vdranjxy/logs/git-deploy.log 2>&1 || true
    - cd /home/vdranjxy/comrades-master && ./node_modules/.bin/pm2 save >> /home/vdranjxy/logs/git-deploy.log 2>&1 || true

    # Log completion
    - echo "=== Deployment completed at $(date) ===" >> /home/vdranjxy/logs/git-deploy.log
    - echo "" >> /home/vdranjxy/logs/git-deploy.log

    

